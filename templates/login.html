<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Harkish-Verse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        .box {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: #151522;
            box-shadow: 0 0 35px rgba(100, 80, 255, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #0d0d15;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #8c7cff;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-bottom: 10px;
            color: #ff7675;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Harkish-Verse</h1>
    <p>Login to your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div class="signup">
        Don't have an account?
        <a href="{{ url_for('signup') }}">Create Account</a>
    </div>

</div>

</body>
</html>
